name: Deploy demo ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build demo statis
        run: npm run build
        env:
          VITE_DEMO_MODE: "1"
          VITE_BASE_PATH: /simskul-react/

      - name: Cek status GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if echo "$info" | jq -e '.build_type == "workflow"' > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages belum aktif. Buka Settings -> Pages -> Source: GitHub Actions, lalu jalankan ulang workflow ini."
            echo "### GitHub Pages belum aktif" >> "$GITHUB_STEP_SUMMARY"
            echo "Buka **Settings -> Pages**, pilih **Source: GitHub Actions**, lalu jalankan ulang workflow ini." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
